name: nakofun
version: 1.0
main: com.nakofun.plugin.Nakofun
api-version: 1.12

commands:
  nf:
    description: Core command for the nakofun plugin. Handles particle rings!
    usage: /<command> [particles]
    permission: nako.fun
    permission-message: "§cYou do not have permission to use this command!"

permissions:
  nako.fun:
    description: Allows players to access the /nf command tree.
    default: op
