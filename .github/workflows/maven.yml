name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    # This is the vital compilation step you need back!
    - name: Build artifact with Maven
      run: mvn -B package --file pom.xml

    # This uploads the generated jar right to your browser
    - name: upload compiled plugin jar
      uses: actions/upload-artifact@v4
      with:
        name: nakofun-plugin
        path: target/*.jar
